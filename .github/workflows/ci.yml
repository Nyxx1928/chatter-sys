name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  IMAGE_TAG: ${{ github.sha }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/java-proj-backend', secrets.DOCKERHUB_USERNAME) || 'local/java-proj-backend' }}
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/java-proj-frontend', secrets.DOCKERHUB_USERNAME) || 'local/java-proj-frontend' }}

jobs:
  phase1-lint-validate:
    name: phase 1 - lint and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Validate backend
        run: mvn -DskipTests=true validate

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  phase2-unit-tests:
    name: phase 2 - unit testing
    runs-on: ubuntu-latest
    needs: [phase1-lint-validate]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run backend unit tests
        run: mvn -Dtest="*Test" -DfailIfNoTests=false test

  phase3-integration-tests:
    name: phase 3 - integration testing
    runs-on: ubuntu-latest
    needs: [phase2-unit-tests]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run backend integration tests
        run: mvn -Dtest="*IntegrationTest" -DfailIfNoTests=false test

  phase4-e2e-playwright:
    name: phase 4 - e2e playwright
    runs-on: ubuntu-latest
    needs: [phase3-integration-tests]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Detect Playwright config
        id: playwright
        run: |
          if ls frontend/playwright.config.* 1> /dev/null 2>&1; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.playwright.outputs.enabled == 'true'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.playwright.outputs.enabled == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright.outputs.enabled == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        if: steps.playwright.outputs.enabled == 'true'
        working-directory: frontend
        run: npx playwright test

  phase5-test-build-docker:
    name: phase 5 - test and build docker
    runs-on: ubuntu-latest
    needs: [phase4-e2e-playwright]
    outputs:
      backend_built: ${{ steps.dockerfiles.outputs.backend }}
      frontend_built: ${{ steps.dockerfiles.outputs.frontend }}
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      images_pushed: ${{ steps.images.outputs.images_pushed }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Detect Dockerfiles
        id: dockerfiles
        run: |
          if [ -f Dockerfile ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          if [ -f frontend/Dockerfile ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: Set image names
        id: images
        run: |
          echo "backend_image=${BACKEND_IMAGE}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_IMAGE}" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "images_pushed=true" >> $GITHUB_OUTPUT
          else
            echo "images_pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfiles.outputs.backend == 'true' || steps.dockerfiles.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to Docker Hub
        if: (steps.dockerfiles.outputs.backend == 'true' || steps.dockerfiles.outputs.frontend == 'true') && github.event_name == 'push' && steps.images.outputs.images_pushed == 'true'
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        if: steps.dockerfiles.outputs.backend == 'true'
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile
          load: ${{ github.event_name != 'push' || steps.images.outputs.images_pushed != 'true' }}
          push: ${{ github.event_name == 'push' && steps.images.outputs.images_pushed == 'true' }}
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build frontend image
        if: steps.dockerfiles.outputs.frontend == 'true'
        uses: docker/build-push-action@v7.1.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: ${{ github.event_name != 'push' || steps.images.outputs.images_pushed != 'true' }}
          push: ${{ github.event_name == 'push' && steps.images.outputs.images_pushed == 'true' }}
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: SBOM (backend)
        if: steps.dockerfiles.outputs.backend == 'true'
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.images.outputs.backend_image }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom-backend.spdx.json

      - name: SBOM (frontend)
        if: steps.dockerfiles.outputs.frontend == 'true'
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.images.outputs.frontend_image }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json

      - name: Trivy scan (backend)
        if: steps.dockerfiles.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backend_image }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Trivy scan (frontend)
        if: steps.dockerfiles.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.frontend_image }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  phase6-security-scan:
    name: phase 6 - security scan
    runs-on: ubuntu-latest
    needs: [phase5-test-build-docker]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Cosign
        if: needs.phase5-test-build-docker.outputs.images_pushed == 'true'
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign backend image
        if: needs.phase5-test-build-docker.outputs.backend_built == 'true' && needs.phase5-test-build-docker.outputs.images_pushed == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ${{ needs.phase5-test-build-docker.outputs.backend_image }}:${{ env.IMAGE_TAG }}

      - name: Sign frontend image
        if: needs.phase5-test-build-docker.outputs.frontend_built == 'true' && needs.phase5-test-build-docker.outputs.images_pushed == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ${{ needs.phase5-test-build-docker.outputs.frontend_image }}:${{ env.IMAGE_TAG }}

  phase7-ci-summary:
    name: phase 7 - ci summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - phase1-lint-validate
      - phase2-unit-tests
      - phase3-integration-tests
      - phase4-e2e-playwright
      - phase5-test-build-docker
      - phase6-security-scan
    steps:
      - name: Write summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 1 (Lint/Validate): ${{ needs.phase1-lint-validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 2 (Unit Tests): ${{ needs.phase2-unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 3 (Integration Tests): ${{ needs.phase3-integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 4 (E2E Playwright): ${{ needs.phase4-e2e-playwright.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 5 (Docker Build): ${{ needs.phase5-test-build-docker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 6 (Security Scan): ${{ needs.phase6-security-scan.result }}" >> $GITHUB_STEP_SUMMARY
