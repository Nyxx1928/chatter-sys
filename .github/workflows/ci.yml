name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  IMAGE_TAG: ${{ github.sha }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/java-proj-backend', secrets.DOCKERHUB_USERNAME) || 'local/java-proj-backend' }}
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/java-proj-frontend', secrets.DOCKERHUB_USERNAME) || 'local/java-proj-frontend' }}

jobs:
  changes:
    name: detect dependency changes
    runs-on: ubuntu-latest
    outputs:
      deps_changed: ${{ steps.final.outputs.deps_changed }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Detect dependency file changes (PRs only)
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v3.0.2
        with:
          filters: |
            deps:
              - 'pom.xml'
              - '**/package.json'
              - '**/package-lock.json'
              - '**/yarn.lock'
              - '**/pnpm-lock.yaml'

      - name: Set dependency change output
        id: final
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "deps_changed=${{ steps.filter.outputs.deps }}" >> $GITHUB_OUTPUT
          else
            echo "deps_changed=true" >> $GITHUB_OUTPUT
          fi

  phase1-lint-validate:
    name: phase 1 - lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Validate backend
        run: mvn -DskipTests=true validate

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

  phase2-unit-tests:
    name: phase 2 - unit testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [phase1-lint-validate]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run backend unit tests
        run: mvn -Dtest="*Test" -DfailIfNoTests=false test

  phase3-integration-tests:
    name: phase 3 - integration testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [phase1-lint-validate]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run backend integration tests
        run: mvn -Dtest="*IntegrationTest" -DfailIfNoTests=false test

  phase4-e2e-playwright:
    name: phase 4 - e2e playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [phase1-lint-validate]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Detect Playwright config
        id: playwright
        run: |
          if ls frontend/playwright.config.* 1> /dev/null 2>&1; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.playwright.outputs.enabled == 'true'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.playwright.outputs.enabled == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright.outputs.enabled == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps

      # Two-step visual snapshot handling:
      # 1. Generate missing snapshots (exit code ignored — first run has no baselines)
      # 2. Run actual tests with retries for comparison
      - name: Generate visual snapshot baselines
        if: steps.playwright.outputs.enabled == 'true'
        working-directory: frontend
        run: npx playwright test --update-snapshots --reporter=list || true

      - name: Run Playwright tests
        if: steps.playwright.outputs.enabled == 'true'
        working-directory: frontend
        run: npx playwright test --retries=2

  phase5-mobile-check:
    name: phase 5 - mobile type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [phase1-lint-validate]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: expo-chat-app/package-lock.json

      - name: Install mobile dependencies
        working-directory: expo-chat-app
        run: npm ci

      - name: TypeScript type check
        working-directory: expo-chat-app
        run: npx tsc --noEmit

  phase6-secrets-scan:
    name: phase 6 - secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [phase1-lint-validate]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Scan for secrets
        run: |
          ! rg -n "\b(?i)(?:sk_live|sk_test|pk_live|pk_test|ghp_|gho_|ghu_|ghs_|github_pat)_[A-Za-z0-9]+" --glob "*.{ts,tsx,js,jsx,java,kt,go,py}" --glob "!**/node_modules/**" --glob "!**/target/**" .
          ! rg -n "(?i)(?:SUPABASE_SERVICE_ROLE|DOCKERHUB_TOKEN|POSTGRES_PASSWORD)\s*=" --glob "*.{ts,tsx,js,jsx,java,properties}" --glob "!**/node_modules/**" --glob "!**/target/**" .
          ! rg -n "-----BEGIN (?:RSA |EC |)PRIVATE KEY-----" --glob "**/*" --glob "!**/node_modules/**" --glob "!**/target/**" .

  phase7-build-docker:
    name: phase 7 - build docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [phase2-unit-tests, phase3-integration-tests, phase4-e2e-playwright, phase5-mobile-check, changes]
    outputs:
      backend_built: ${{ steps.dockerfiles.outputs.backend }}
      frontend_built: ${{ steps.dockerfiles.outputs.frontend }}
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      images_pushed: ${{ steps.images.outputs.images_pushed }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Detect Dockerfiles
        id: dockerfiles
        run: |
          if [ -f Dockerfile ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi
          if [ -f frontend/Dockerfile ]; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: Set image names
        id: images
        run: |
          echo "backend_image=${BACKEND_IMAGE}" >> $GITHUB_OUTPUT
          echo "frontend_image=${FRONTEND_IMAGE}" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            event_push=true
          else
            event_push=false
          fi
          if [ "${event_push}" = "true" ] && [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "images_pushed=true" >> $GITHUB_OUTPUT
          else
            echo "images_pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfiles.outputs.backend == 'true' || steps.dockerfiles.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to Docker Hub
        if: (steps.dockerfiles.outputs.backend == 'true' || steps.dockerfiles.outputs.frontend == 'true') && steps.images.outputs.images_pushed == 'true'
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        if: steps.dockerfiles.outputs.backend == 'true'
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: Dockerfile
          load: ${{ steps.images.outputs.images_pushed != 'true' }}
          push: ${{ steps.images.outputs.images_pushed == 'true' }}
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build frontend image
        if: steps.dockerfiles.outputs.frontend == 'true'
        uses: docker/build-push-action@v7.1.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: ${{ steps.images.outputs.images_pushed != 'true' }}
          push: ${{ steps.images.outputs.images_pushed == 'true' }}
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: SBOM (backend)
        if: steps.dockerfiles.outputs.backend == 'true' && steps.images.outputs.images_pushed == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.deps_changed == 'true')
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.images.outputs.backend_image }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom-backend.spdx.json
          push-to-registry: true

      - name: SBOM (frontend)
        if: steps.dockerfiles.outputs.frontend == 'true' && steps.images.outputs.images_pushed == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.deps_changed == 'true')
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ steps.images.outputs.frontend_image }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom-frontend.spdx.json
          push-to-registry: true

      - name: Trivy scan (backend)
        if: steps.dockerfiles.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.backend_image }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Trivy scan (frontend)
        if: steps.dockerfiles.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.frontend_image }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  phase8-security-scan:
    name: phase 8 - security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [phase7-build-docker, changes]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Cosign
        if: needs.phase7-build-docker.outputs.images_pushed == 'true'
        uses: sigstore/cosign-installer@v4.1.1

      - name: Sign backend image
        if: needs.phase7-build-docker.outputs.backend_built == 'true' && needs.phase7-build-docker.outputs.images_pushed == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ${{ needs.phase7-build-docker.outputs.backend_image }}:${{ env.IMAGE_TAG }}

      - name: Sign frontend image
        if: needs.phase7-build-docker.outputs.frontend_built == 'true' && needs.phase7-build-docker.outputs.images_pushed == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ${{ needs.phase7-build-docker.outputs.frontend_image }}:${{ env.IMAGE_TAG }}

  phase9-dependency-audit:
    name: phase 9 - dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [phase1-lint-validate]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit
        if: github.event_name != 'pull_request' || needs.changes.outputs.deps_changed == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Set up Java
        if: github.event_name == 'schedule'
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache OWASP NVD data
        if: github.event_name == 'schedule'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Maven dependency audit (weekly only)
        if: github.event_name == 'schedule'
        run: mvn org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DnvdDatafeedUrl=https://www.nist.gov/feeds -DautoUpdate=false

  phase10-ci-summary:
    name: phase 10 - ci summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - phase1-lint-validate
      - phase2-unit-tests
      - phase3-integration-tests
      - phase4-e2e-playwright
      - phase5-mobile-check
      - phase6-secrets-scan
      - phase7-build-docker
      - phase8-security-scan
      - phase9-dependency-audit
    steps:
      - name: Write summary
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 1 (Lint/Validate): ${{ needs.phase1-lint-validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 2 (Unit Tests): ${{ needs.phase2-unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 3 (Integration Tests): ${{ needs.phase3-integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 4 (E2E Playwright): ${{ needs.phase4-e2e-playwright.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 5 (Mobile TypeScript): ${{ needs.phase5-mobile-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 6 (Secrets Scan): ${{ needs.phase6-secrets-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 7 (Docker Build): ${{ needs.phase7-build-docker.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 8 (Security Scan): ${{ needs.phase8-security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Phase 9 (Dependency Audit): ${{ needs.phase9-dependency-audit.result }}" >> $GITHUB_STEP_SUMMARY
