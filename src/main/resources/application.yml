# Spring Boot Application Configuration
# Real-Time Chat System

spring:
  application:
    name: realtime-chat-system

  # Database Configuration
  datasource:
    # For local development, uses these defaults
    # For Render (prod profile), RenderDatabaseConfig.java handles DATABASE_URL conversion
    url: jdbc:postgresql://localhost:5432/chatdb
    username: ${DB_USERNAME:chatuser}
    password: ${DB_PASSWORD:chatpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  # Mail Configuration (SMTP for email verification)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false

# Brevo Email Service Configuration (HTTP API)
# Brevo offers 300 emails/day with no domain required
brevo:
  api-key: ${BREVO_API_KEY:}
  from-email: ${BREVO_FROM_EMAIL:}
  from-name: ${BREVO_FROM_NAME:Real-Time Chat}
  enabled: ${BREVO_ENABLED:true}

# Application base URL for building verification links
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  mail:
    # Optional but recommended: many SMTP providers require a real From address.
    from: ${MAIL_FROM:}
  verification:
    # When true, /api/auth/register includes verificationUrl in the response.
    # This is helpful for local dev when SMTP isn't configured.
    expose-link: ${EXPOSE_VERIFICATION_LINK:false}
  admin:
    # Enable admin endpoints for development/testing
    # WARNING: Set to false in production!
    enabled: ${ADMIN_ENABLED:false}

# Server Configuration
server:
  port: ${PORT:8080}  # Render sets PORT env variable
  error:
    include-message: always
    include-binding-errors: always

# Logging Configuration
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.messaging: INFO
    org.springframework.websocket: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.example.chat: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/chat-application.log
    max-size: 10MB
    max-history: 7

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-minimum-256-bits}
  expiration: 86400000 # 24 hours in milliseconds

# WebSocket Configuration
websocket:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  message-size-limit: 128000 # 128KB
  send-buffer-size-limit: 512000 # 512KB
  send-time-limit: 20000 # 20 seconds

# CORS Configuration
# Comma-separated list of allowed origins beyond localhost:3000.
# Set CORS_ALLOWED_ORIGINS in your environment to add origins without changing code.
# Example: https://chatter-sys.vercel.app,https://abc123.ngrok-free.app
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://chatter-sys.vercel.app}

# Actuator Configuration (for health checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
logging:
  level:
    root: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.messaging: DEBUG
    org.springframework.websocket: DEBUG
    org.example.chat: TRACE
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod
  
  # Database Configuration for Production (Neon via Render)
  datasource:
    # JDBC_DATABASE_URL is built by start.sh from DATABASE_URL (set in Render dashboard)
    # Neon connection string includes credentials and sslmode=require in the URL
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/chatdb}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 600000
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
      
management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: false
    mail:
      enabled: false
  
logging:
  level:
    root: WARN
    org.springframework.web: WARN
    org.springframework.security: INFO
    org.springframework.messaging: INFO
    org.springframework.websocket: INFO
    org.example.chat: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  verification:
    expose-link: true
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/chat-application.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB
