services:
  # Backend Service
  - type: web
    name: chat-backend
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://chatter-sys.vercel.app
      - key: PORT
        value: 8080
      # DATABASE_URL must be set manually in Render dashboard
      # Paste the Neon connection string (postgresql://user:pass@host/db?sslmode=require)
      - key: DATABASE_URL
        value: <paste your Neon connection string here>

      # Email configuration (for email verification via Resend)
      # Sign up at https://resend.com, get an API key from the dashboard
      - key: MAIL_HOST
        value: smtp.resend.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: resend
      - key: MAIL_PASSWORD
        value: re_<your-resend-api-key>
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      - key: APP_BASE_URL
        value: https://<your-render-app-name>.onrender.com

# No databases section — using Neon (external) instead of Render Postgres
