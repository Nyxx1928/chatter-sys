services:
  # Backend Service
  - type: web
    name: chat-backend
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://chatter-sys.vercel.app
      - key: PORT
        value: 8080
      # DATABASE_URL must be set manually in Render dashboard
      # Paste the Neon connection string (postgresql://user:pass@host/db?sslmode=require)
      # - key: DATABASE_URL
      #   value: <paste your Neon connection string here>

# No databases section — using Neon (external) instead of Render Postgres
