services:
  # Backend Service
  - type: web
    name: chat-backend
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    # Use liveness probe so startup isn't blocked by external dependencies (DB/SMTP, etc.)
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://chatter-sys.vercel.app
      - key: PORT
        value: 8080
      # IMPORTANT: Do NOT set DATABASE_URL to a placeholder here.
      # Set DATABASE_URL in the Render dashboard (Environment tab) to your real Neon URL:
      # postgresql://user:pass@host/dbname?sslmode=require

      # Email configuration (for email verification via Brevo)
      # Sign up at https://brevo.com, get an API key from the dashboard
      - key: BREVO_API_KEY
        value: <your-brevo-api-key>
      - key: BREVO_FROM_EMAIL
        value: <your-from-email>
      - key: BREVO_FROM_NAME
        value: Chatter Real-Time Chat
      - key: BREVO_ENABLED
        value: "true"
      - key: APP_BASE_URL
        value: https://<your-render-app-name>.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://chatter-sys.vercel.app

# No databases section — using Neon (external) instead of Render Postgres
