services:
  # Backend Service
  - type: web
    name: chat-backend
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    # Use liveness probe so startup isn't blocked by external dependencies (DB/SMTP, etc.)
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://chatter-sys.vercel.app
      - key: PORT
        value: 8080
      # IMPORTANT: Do NOT set DATABASE_URL to a placeholder here.
      # Set DATABASE_URL in the Render dashboard (Environment tab) to your real Neon URL:
      # postgresql://user:pass@host/dbname?sslmode=require

      # Email configuration (for email verification via Resend)
      # Sign up at https://resend.com, get an API key from the dashboard
      - key: MAIL_HOST
        value: smtp.resend.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: resend
      - key: MAIL_PASSWORD
        value: re_<your-resend-api-key>
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_SMTP_STARTTLS
        value: "true"
      - key: APP_BASE_URL
        value: https://<your-render-app-name>.onrender.com

# No databases section — using Neon (external) instead of Render Postgres
