services:
  # Backend Service
  - type: web
    name: chat-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: chat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.onrender.com
      - key: PORT
        value: 8080

databases:
  # PostgreSQL Database
  - name: chat-db
    databaseName: chatdb
    user: chatuser
    plan: free
    region: oregon
